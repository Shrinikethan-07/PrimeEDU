<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | PrimeEDU</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .admin-page { max-width: 860px; margin: 2rem auto; }
        
        .admin-stat-cards { display: flex; justify-content: center; margin-bottom: 2rem; }
        .stat-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 16px; padding: 1.5rem; text-align: center;
            width: 100%; max-width: 400px;
        }
        .stat-val { font-family: var(--font-heading); font-size: 2.5rem; color: var(--neon-cyan); }
        .stat-label { font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }

        .admin-table-container {
            background: rgba(10,5,25,0.8); border: 1px solid rgba(157, 0, 255, 0.2);
            border-radius: 20px; overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(157, 0, 255, 0.1); color: white; padding: 1rem; text-align: left; font-family: var(--font-heading); font-size: 0.8rem; letter-spacing: 1px; }
        td { padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); color: #ccc; font-size: 0.9rem; }
        tr:hover td { background: rgba(0,243,255,0.03); color: white; }
        .td-email { color: var(--neon-cyan); font-family: monospace; }
        
        #unauthorized-view { display: none; text-align: center; margin-top: 100px; }
    </style>
<script>
    window.API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? '' : 'https://primeedu.onrender.com';
</script>
</head>
<body>
    <div class="app-container" style="display: block; padding: 2rem;">
        
        <!-- UNAUTHORIZED STATE -->
        <div id="unauthorized-view">
            <i class="fas fa-user-shield" style="font-size: 5rem; color: #ff3366; margin-bottom: 1.5rem;"></i>
            <h1 style="color: white; font-family: var(--font-heading);">ACCESS DENIED</h1>
            <p style="color: #999;">Only the user named "Shrinikethan M S" with email "buvanavel.m01@gmail.com" can access the Admin Dashboard.</p>
            <button class="btn-enter" style="width: 200px; margin: 2rem auto;" onclick="window.location.href='index.html'">Return to Login</button>
        </div>

        <!-- DASHBOARD STATE -->
        <div id="dashboard-view" class="admin-page" style="display: none;">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h1 style="color: white; font-family: var(--font-heading);"><i class="fas fa-server" style="color: var(--neon-purple);"></i> System Administration</h1>
                    <p style="color: var(--text-secondary);">Real-time monitoring of all registered Warriors.</p>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button class="neon-btn" style="border-color: var(--neon-pink); color: var(--neon-pink);" onmouseover="this.style.background='var(--neon-pink)'; this.style.color='var(--bg-deep)'; this.style.boxShadow='0 0 15px var(--neon-pink)';" onmouseout="this.style.background='transparent'; this.style.color='var(--neon-pink)'; this.style.boxShadow='none';" onclick="wipeFakeWarriors()"><i class="fas fa-trash-alt"></i> Wipe Test Warriors</button>
                    <button class="neon-btn" onclick="window.location.href='dashboard.html'">Exit to Dashboard</button>
                </div>
            </header>

            <div class="admin-stat-cards">
                <div class="stat-card">
                    <div class="stat-val" id="stat-users">0</div>
                    <div class="stat-label">Total Warriors</div>
                </div>
            </div>

            <div class="admin-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>WARRIOR NAME</th>
                            <th>GOOGLE EMAIL ID</th>
                            <th>REGISTERED AT</th>
                            <th>LAST LOGIN</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        function formatIST(dateStr) {
            if (!dateStr) return "Never";
            try {
                let cleanStr = dateStr;
                // If it is an ISO datetime without offset/timezone info, append +05:30
                if (dateStr && !dateStr.includes('+') && !dateStr.endsWith('Z') && dateStr.includes('T')) {
                    cleanStr = dateStr + '+05:30';
                }
                const d = new Date(cleanStr);
                const options = {
                    timeZone: 'Asia/Kolkata',
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                };
                let formatted = d.toLocaleString('en-GB', options);
                return formatted.toUpperCase() + ' IST';
            } catch(e) {
                return dateStr;
            }
        }

        async function loadAdminData() {
            const token = localStorage.getItem('primeedu_token');
            if(!token) {
                document.getElementById('unauthorized-view').style.display = 'block';
                return;
            }

            try {
                const res = await fetch(window.API_BASE_URL + '/api/admin/users', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (res.status === 403 || res.status === 401) {
                    document.getElementById('unauthorized-view').style.display = 'block';
                    return;
                }
                
                const data = await res.json();
                if (data.status === 'success') {
                    document.getElementById('dashboard-view').style.display = 'block';
                    
                    const users = data.users;
                    const tbody = document.getElementById('user-table-body');
                    let html = '';
                    
                    users.forEach(u => {
                        html += `
                        <tr>
                            <td style="font-weight: 600; color: white;">${u.name}</td>
                            <td class="td-email">${u.email}</td>
                            <td>${formatIST(u.creation_date)}</td>
                            <td>${formatIST(u.last_login)}</td>
                        </tr>
                        `;
                    });
                    
                    tbody.innerHTML = html;
                    document.getElementById('stat-users').innerText = users.length;
                }
            } catch (e) {
                const tbody = document.getElementById('user-table-body');
                if (tbody) {
                    tbody.innerHTML = `
                    <tr>
                        <td colspan="3" style="color: var(--neon-pink); text-align: center; font-weight: bold; padding: 2rem;">
                            <i class="fas fa-triangle-exclamation"></i> Error connecting to server to load admin data.
                        </td>
                    </tr>`;
                }
                document.getElementById('dashboard-view').style.display = 'block';
            }
        }
        
        async function wipeFakeWarriors() {
            const token = localStorage.getItem('primeedu_token');
            if(!token) {
                alert("Unauthorized: No token found. Please log in again.");
                return;
            }

            if (!confirm("Are you sure you want to WIPE all test warriors, clans, and associated test sessions/journals from the database? This action is irreversible.")) {
                return;
            }

            try {
                const res = await fetch(window.API_BASE_URL + '/api/admin/reset_fake_warriors', {
                    method: 'POST',
                    headers: { 
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await res.json();
                if (res.status === 200 && data.status === 'success') {
                    alert("Wipe successful! All test entries have been cleared.");
                    loadAdminData(); // Refresh the table
                } else {
                    alert("Error: " + (data.message || "Failed to wipe test warriors."));
                }
            } catch(e) {
                console.error(e);
                alert("Network error: Failed to connect to server.");
            }
        }
        
        loadAdminData();
    </script>
    <script src="notifications.js"></script>
</body>
</html>
