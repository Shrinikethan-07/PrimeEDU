<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recap Center | PrimeEDU</title>
    <meta name="description" content="PrimeEDU Recap Center — your achievements immortalized in premium shareable cards.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .recap-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 2rem;
            padding: 1.5rem 0;
        }

        .recap-poster {
            background: linear-gradient(135deg, #0d041a 0%, #1a0a2e 100%);
            border: 2px solid var(--neon-purple);
            border-radius: 20px;
            padding: 1.5rem;
            aspect-ratio: 4/5;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 24px rgba(157, 0, 255, 0.18);
            color: white;
            transition: all 0.4s ease;
            animation: luxuryReveal 0.8s cubic-bezier(0.23, 1, 0.32, 1) backwards;
        }

        .recap-poster::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -150%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg,
                    transparent 45%,
                    rgba(0, 243, 255, 0.1) 48%,
                    rgba(0, 243, 255, 0.3) 50%,
                    rgba(0, 243, 255, 0.1) 52%,
                    transparent 55%);
            transition: 0s;
            pointer-events: none;
            z-index: 10;
        }

        .recap-poster:hover::after {
            left: 150%;
            transition: 0.7s ease-in-out;
        }

        @keyframes luxuryReveal {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .recap-poster:hover {
            transform: translateY(-6px);
            border-color: var(--neon-cyan);
            box-shadow: 0 12px 36px rgba(0, 243, 255, 0.15);
        }

        .poster-header h2 {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            margin: 0;
        }

        .blended-graph {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: contrast(1.1) brightness(1.2) drop-shadow(0 0 5px var(--neon-cyan));
            animation: graphGrow 1.5s ease-out forwards;
            opacity: 0;
        }

        @keyframes graphGrow {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* SOCIAL SHARE SYSTEM */
        .share-menu-wrap {
            position: relative;
            width: 100%;
            margin-top: 0.75rem;
            flex-shrink: 0;
            z-index: 5;
        }

        .share-main-btn {
            width: 100%;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan));
            color: white;
            border: none;
            padding: 0.7rem;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.78rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(157, 0, 255, 0.25);
        }

        .share-main-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 18px rgba(0, 243, 255, 0.35);
            filter: brightness(1.1);
        }

        .share-dropdown {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(10, 5, 25, 0.98);
            border: 1px solid rgba(157, 0, 255, 0.35);
            border-radius: 14px;
            padding: 0.6rem;
            display: none;
            flex-direction: column;
            gap: 0.4rem;
            box-shadow: 0 -8px 30px rgba(157, 0, 255, 0.2);
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        .share-dropdown.open { display: flex; }

        .share-option {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0.8rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.78rem;
            font-family: var(--font-body);
            font-weight: 600;
            transition: all 0.2s;
            border: none;
            background: transparent;
            color: white;
            width: 100%;
            text-align: left;
        }

        .share-option:hover { background: rgba(255,255,255,0.07); transform: translateX(3px); }

        .share-option .opt-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .opt-wa   { background: #25D366; }
        .opt-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .opt-tw   { background: #1DA1F2; }
        .opt-copy { background: rgba(0,243,255,0.2); border: 1px solid rgba(0,243,255,0.3); color: var(--neon-cyan); }

        .vibrant-stat-circle {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            border: 2px solid rgba(0, 243, 255, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1), inset 0 0 15px rgba(0, 243, 255, 0.05);
            animation: circlePopIn 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            margin: 0.5rem auto;
        }

        @keyframes circlePopIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .growth-chart-box {
            height: 130px;
            margin: 0.5rem 0;
        }
    </style>
<script>
    window.API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? '' : 'https://primeedu.onrender.com';
</script>
</head>

<body>
    <div class="app-container">
        <nav class="sidebar">
            <div class="logo">
                <i class="fas fa-bolt"></i>
                <span>PrimeEDU</span>
            </div>
                        <ul class="nav-links">
                <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="fas fa-th-large"></i><span>Dashboard</span></a></li>
                <li class="nav-item"><a href="timer.html" class="nav-link"><i class="fas fa-stopwatch"></i><span>Study Timer</span></a></li>
                <li class="nav-item"><a href="journal.html" class="nav-link"><i class="fas fa-scroll"></i><span>Journal</span></a></li>
                <li class="nav-item"><a href="modules.html" class="nav-link"><i class="fas fa-book-open"></i><span>Library</span></a></li>
                <li class="nav-item"><a href="recaps.html" class="nav-link active"><i class="fas fa-magic"></i><span>Recaps</span></a></li>
                <li class="nav-item"><a href="leaderboard.html" class="nav-link"><i class="fas fa-trophy"></i><span>Leaderboard</span></a></li>
            <li class="nav-item admin-only-link" style="display: none;">
                    <a href="admin.html" class="nav-link" style="color: #ff3366;">
                        <i class="fas fa-user-shield"></i><span>Admin</span>
                    </a>
                </li>
            </ul>
            <div class="sidebar-bottom">
                <div class="avatar-preview"><img src="" alt="avatar" class="avatar-circle"></div>
            </div>
        </nav>

        <main class="main-content">
            <header>
                <div class="header-left">
                    <div style="display:flex; align-items:center; gap:1rem;">
                        <img src="" alt="avatar" id="header-avatar" class="avatar-circle" style="width:48px;height:48px;">
                        <div>
                            <h1>Recap Center</h1>
                            <p class="text-secondary">Your achievements, immortalized. Share with the universe.</p>
                        </div>
                    </div>
                </div>
            </header>

            <div id="recap-container">
                <h2 class="section-title"><i class="fas fa-calendar-week"></i> Weekly Insights</h2>
                <div class="recap-grid" id="weekly-grid"></div>

                <h2 class="section-title" style="margin-top:2rem;"><i class="fas fa-calendar-alt"></i> Monthly Mastery</h2>
                <div class="recap-grid" id="monthly-grid"></div>

                <h2 class="section-title" style="margin-top:2rem;"><i class="fas fa-crown"></i> Yearly Legacy</h2>
                <div class="recap-grid" id="yearly-grid"></div>
            </div>
        </main>
    </div>

    <script>
        // Close all share dropdowns when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.share-menu-wrap')) {
                document.querySelectorAll('.share-dropdown').forEach(d => d.classList.remove('open'));
            }
        });

        // ═══ AVATAR SYNC ═══
        const CHARACTERS = [
            { id: 'itachi', name: 'Itachi', img: 'assets/avatars/itachi.webp', fallback: 'https://i.pinimg.com/736x/f5/0f/52/f50f52e51a8b1f6e24a07e30a8d08157.jpg' },
            { id: 'goku', name: 'Goku', img: 'assets/avatars/goku.webp', fallback: 'https://i.pinimg.com/736x/c4/11/c9/c411c9e40e6f4b3d6e2a1f0c5b8a7d2e.jpg' },
            { id: 'gojo', name: 'Gojo', img: 'assets/avatars/gojo.webp', fallback: 'https://i.pinimg.com/736x/97/4a/5b/974a5b6a4e8b3c2d1f0e9a8b7c6d5e4f.jpg' },
            { id: 'sasuke', name: 'Sasuke', img: 'assets/avatars/sasuke.webp', fallback: 'https://i.pinimg.com/736x/4e/40/87/4e4087e01177d1c3ea5e7143e7284f9e.jpg' },
            { id: 'naruto', name: 'Naruto', img: 'assets/avatars/naruto.webp', fallback: 'https://i.pinimg.com/736x/d0/b5/3b/d0b53bc5ddd3b25c55ea471fa30c64d0.jpg' },
            { id: 'kakashi', name: 'Kakashi', img: 'assets/avatars/kakashi.webp', fallback: 'https://i.pinimg.com/736x/2b/3c/4d/2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e.jpg' },
        ];

        function getSelectedChar() {
            const id = localStorage.getItem('primeedu_avatar') || 'itachi';
            return CHARACTERS.find(c => c.id === id) || CHARACTERS[0];
        }

        function syncAvatars() {
            const char = getSelectedChar();
            document.querySelectorAll('.avatar-circle, #header-avatar').forEach(img => {
                img.src = char.img;
                img.onerror = () => { img.src = char.fallback; };
            });
        }
        syncAvatars();

        // ═══ SHARE SYSTEM ═══
        const pageUrl = window.location.href;

        function toggleShareMenu(btn) {
            const dropdown = btn.nextElementSibling;
            const isOpen = dropdown.classList.contains('open');
            document.querySelectorAll('.share-dropdown').forEach(d => d.classList.remove('open'));
            if (!isOpen) dropdown.classList.add('open');
        }

        function shareViaWhatsApp(title, text) {
            const msg = encodeURIComponent(`🔥 ${title}\n${text}\n\n📚 PrimeEDU Warrior Journey\n${pageUrl}`);
            window.open(`https://api.whatsapp.com/send?text=${msg}`, '_blank');
        }

        function shareViaInsta(title) {
            navigator.clipboard.writeText(`🔥 ${title} | PrimeEDU Warrior Journey 📚\n${pageUrl}`).then(() => {
                showShareToast('Caption copied! Open Instagram and paste it ✓');
            });
        }

        function shareViaTwitter(title, text) {
            const tweet = encodeURIComponent(`🔥 ${title} — ${text}\n\n📚 PrimeEDU Warrior Journey\n${pageUrl}`);
            window.open(`https://twitter.com/intent/tweet?text=${tweet}`, '_blank');
        }

        function copyShareLink(title, text) {
            const content = `🔥 ${title}\n${text}\n\nPrimeEDU Warrior Journey: ${pageUrl}`;
            navigator.clipboard.writeText(content).then(() => {
                showShareToast('Link & recap copied to clipboard ✓');
            });
        }

        function showShareToast(msg) {
            const t = document.createElement('div');
            t.style.cssText = `position:fixed;bottom:2rem;right:2rem;background:rgba(10,5,25,0.95);border:1px solid var(--neon-cyan);color:white;padding:0.75rem 1.5rem;border-radius:12px;font-size:0.8rem;z-index:99999;box-shadow:0 0 20px rgba(0,243,255,0.3);font-family:var(--font-body);transition:opacity 0.4s;`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 3000);
        }

        // ═══ POSTER BUILDER ═══
        function createPoster(data, index = 0) {
            const char = getSelectedChar();
            const poster = document.createElement('div');
            poster.className = 'recap-poster';
            poster.style.animationDelay = `${index * 0.12}s`;

            const escapedTitle = (data.title || '').replace(/'/g, "\\'");
            const escapedContent = (data.content || data.statLabel || '').replace(/'/g, "\\'");
            const dropdownId = `share-dd-${Date.now()}-${index}`;

            poster.innerHTML = `
                <div class="poster-header" style="display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;">
                    <h2 style="margin-bottom:0.4rem;">${data.title}</h2>
                    <div style="display:flex;align-items:center;gap:0.5rem;">
                        <img src="${char.img}" alt="Avatar" style="width:22px;height:22px;border-radius:50%;object-fit:cover;border:1.5px solid var(--neon-cyan);" onerror="this.src='${char.fallback}'">
                        <span style="font-size:0.7rem;font-weight:600;color:var(--text-secondary);">Seetharam</span>
                    </div>
                </div>

                <div class="poster-content" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1;padding:0.5rem 0;">
                    ${data.html || `<p style="font-size:0.88rem;color:rgba(255,255,255,0.9);">${data.content || ''}</p>`}

                    ${data.type === 'chart' ? `
                        <div class="growth-chart-box" style="width:100%;">
                            <img src="${data.image || (data.chartType === 'bar' ? 'focus_bars.png' : 'consistency_v2.png')}" class="blended-graph" alt="Graph">
                        </div>
                    ` : ''}

                    ${data.type === 'stat' ? `
                        <div class="vibrant-stat-circle">
                            <span style="font-size:1.7rem;font-weight:800;color:#fff;">${data.statValue}</span>
                            <span style="font-size:0.58rem;color:rgba(255,255,255,0.65);text-transform:uppercase;">${data.statLabel}</span>
                        </div>
                    ` : ''}
                </div>

                <div style="position:absolute;bottom:58px;right:16px;font-size:0.55rem;opacity:0.4;font-family:var(--font-heading);color:var(--neon-cyan);letter-spacing:1px;">PRIMEEDU.AI</div>

                <div class="share-menu-wrap">
                    <button class="share-main-btn" onclick="toggleShareMenu(this)">
                        <i class="fas fa-share-alt"></i> Share to Universe
                    </button>
                    <div class="share-dropdown" id="${dropdownId}">
                        <button class="share-option" onclick="shareViaWhatsApp('${escapedTitle}','${escapedContent}')">
                            <span class="opt-icon opt-wa"><i class="fab fa-whatsapp"></i></span>
                            Share on WhatsApp
                        </button>
                        <button class="share-option" onclick="shareViaInsta('${escapedTitle}')">
                            <span class="opt-icon opt-insta"><i class="fab fa-instagram"></i></span>
                            Copy for Instagram
                        </button>
                        <button class="share-option" onclick="shareViaTwitter('${escapedTitle}','${escapedContent}')">
                            <span class="opt-icon opt-tw"><i class="fab fa-twitter"></i></span>
                            Share on X / Twitter
                        </button>
                        <button class="share-option" onclick="copyShareLink('${escapedTitle}','${escapedContent}')">
                            <span class="opt-icon opt-copy"><i class="fas fa-link"></i></span>
                            Copy Link
                        </button>
                        <button class="share-option" onclick="downloadPoster(this)">
                            <span class="opt-icon opt-copy" style="background: rgba(255,42,133,0.2); border-color: rgba(255,42,133,0.3); color: #ff2a85;"><i class="fas fa-download"></i></span>
                            Download Image
                        </button>
                    </div>
                </div>
            `;
            return poster;
        }

        function downloadPoster(btn) {
            const poster = btn.closest('.recap-poster');
            const shareWrap = poster.querySelector('.share-menu-wrap');
            shareWrap.style.display = 'none'; // Hide UI
            
            html2canvas(poster, { backgroundColor: '#0d041a', scale: 2 }).then(canvas => {
                shareWrap.style.display = 'block'; // Restore UI
                const link = document.createElement('a');
                link.download = 'PrimeEDU_Recap.png';
                link.href = canvas.toDataURL();
                link.click();
                showShareToast('Image downloaded! Share it with the universe ✓');
            });
        }

        // ═══ INIT RECAPS ═══
        async function initRecaps() {
            let accountAgeDays = 1;
            try {
                // We add token to headers just in case it's needed by the backend
                const token = localStorage.getItem('primeedu_token');
                const pRes = await fetch(window.API_BASE_URL + '/api/user/profile', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const profile = await pRes.json();
                accountAgeDays = profile.account_age_days || 1;
            } catch(e) {}

            function applyLockOverlay(gridId, requiredDays, periodName) {
                const grid = document.getElementById(gridId);
                grid.style.position = 'relative';
                
                // If the user hasn't reached the required days, we completely hide the cards and show a premium lock card
                grid.innerHTML = ''; // Clear empty space or fake cards
                grid.style.gridTemplateColumns = '1fr'; // Make it take full width
                
                const daysLeft = requiredDays - accountAgeDays;
                const lockCard = document.createElement('div');
                lockCard.style.cssText = `
                    background: linear-gradient(135deg, #121212 0%, #1f1f1f 100%);
                    border: 1px solid #333;
                    border-radius: 20px;
                    padding: 3rem 2rem;
                    text-align: center;
                    box-shadow: inset 0 0 40px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.6);
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    position: relative;
                    overflow: hidden;
                `;
                
                lockCard.innerHTML = `
                    <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #555, transparent);"></div>
                    <i class="fas fa-lock" style="font-size: 3.5rem; color: #666; margin-bottom: 1.5rem; text-shadow: 0 4px 10px rgba(0,0,0,0.5);"></i>
                    <h3 style="color: #eee; font-family: var(--font-heading); font-size: 1.4rem; letter-spacing: 2px; text-transform: uppercase;">${periodName} Locked</h3>
                    <p style="color: #999; font-size: 0.95rem; margin-top: 0.5rem;">You are currently on <strong>Day ${accountAgeDays}</strong>.</p>
                    <div style="margin-top: 1.5rem; background: rgba(0,0,0,0.4); border: 1px solid #222; padding: 0.8rem 1.5rem; border-radius: 12px;">
                        <span style="color: #ccc; font-size: 0.9rem;">Wait <strong style="color: white; font-size: 1.1rem;">${daysLeft}</strong> more days to unlock.</span>
                    </div>
                `;
                
                grid.appendChild(lockCard);
            }

            let dynamicData = {};
            try {
                const response = await fetch(window.API_BASE_URL + '/api/recap/dynamic');
                if (response.ok) {
                    dynamicData = await response.json();
                }
            } catch (e) {
                console.error("Failed to load dynamic data, using fallbacks", e);
            }

            // Weekly Data
            const weeklyGrid = document.getElementById('weekly-grid');
            if(accountAgeDays < 7) {
                applyLockOverlay('weekly-grid', 7, 'Weekly Insights');
            } else {
                const weeklyData = [
                    { title: "Weekly Grit", content: dynamicData.reason || 'You stayed disciplined and forged your mind daily.', type: 'chart', image: dynamicData.image || 'consistency_v2.png' },
                    { title: "Dragon Balls", statValue: dynamicData.highlight_stat || '150', statLabel: dynamicData.label || 'EARNED', type: 'stat' }
                ];
                weeklyData.forEach((d, i) => weeklyGrid.appendChild(createPoster(d, i)));
            }

            // Monthly Data
            const monthlyGrid = document.getElementById('monthly-grid');
            if(accountAgeDays < 30) {
                applyLockOverlay('monthly-grid', 30, 'Monthly Mastery');
            } else {
                const monthlyData = [
                    { title: "Identity", html: `<div style="font-size:0.85rem;color:var(--neon-purple);font-family:var(--font-heading);border:1px solid var(--neon-purple);padding:0.4rem 0.8rem;border-radius:8px;margin-bottom:0.75rem;">THE ALCHEMIST</div><p style="font-size:0.8rem;">Surgical Precision.</p><div style="background-image:url('https://i.pinimg.com/736x/97/4a/5b/974a5b6a4e8b3c2d1f0e9a8b7c6d5e4f.jpg');height:90px;background-size:cover;background-position:center;border-radius:12px;width:100%;"></div>` },
                    { title: "Consistency", content: "28 Day Streak. Unstoppable.", type: 'chart', image: 'consistency_v2.png' },
                    { title: "Knowledge", content: "3 Chapters Decoded.", type: 'chart', image: 'focus_bars.png' },
                    { title: "Focus Master", statValue: "154", statLabel: "HOURS", type: 'stat' }
                ];
                monthlyData.forEach((d, i) => monthlyGrid.appendChild(createPoster(d, i)));
            }

            // Yearly Data
            const yearlyGrid = document.getElementById('yearly-grid');
            if(accountAgeDays < 365) {
                applyLockOverlay('yearly-grid', 365, 'Yearly Legacy');
            } else {
                const yearlyData = [
                    { title: "Legacy", content: "Master of Deep Work.", type: 'chart', image: 'consistency_graph.png' },
                    { title: "Chronos", statValue: "8,400", statLabel: "MINUTES", type: 'stat' },
                    { title: "Growth Mindset", content: "Peak Form.", type: 'chart', image: 'focus_bars.png' },
                    { title: "The Scroll", statValue: "154", statLabel: "ENTRIES", type: 'stat' },
                    { title: "Final Form", html: `<div style="color:#ff00ea;font-family:var(--font-heading);border:1px solid #ff00ea;padding:0.4rem 0.8rem;border-radius:8px;font-size:0.8rem;margin-bottom:0.75rem;">ASCENDED WARRIOR</div><div style="background-image:url('https://i.pinimg.com/736x/4e/40/87/4e4087e01177d1c3ea5e7143e7284f9e.jpg');height:90px;background-size:cover;background-position:center;border-radius:12px;width:100%;"></div>` },
                    { title: "Prime Rating", statValue: "9.8", statLabel: "TIER S+", type: 'stat' }
                ];
                yearlyData.forEach((d, i) => yearlyGrid.appendChild(createPoster(d, i)));
            }
        }

        initRecaps();
