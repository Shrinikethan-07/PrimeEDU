    <style>
        .recap-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            justify-content: center;
            justify-items: center;
            gap: 2rem;
            padding: 1.5rem 0;
        }

        .recap-poster {
            background: linear-gradient(135deg, #0d041a 0%, #1a0a2e 100%);
            border: 2px solid var(--neon-purple);
            border-radius: 20px;
            padding: 1.25rem 1rem 1rem 1rem;
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1 / 1.4;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 24px rgba(157, 0, 255, 0.18);
            color: white;
            transition: all 0.4s ease;
            animation: luxuryReveal 0.8s cubic-bezier(0.23, 1, 0.32, 1) backwards;
        }

        .recap-poster::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -150%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg,
                    transparent 45%,
                    rgba(0, 243, 255, 0.1) 48%,
                    rgba(0, 243, 255, 0.3) 50%,
                    rgba(0, 243, 255, 0.1) 52%,
                    transparent 55%);
            transition: 0s;
            pointer-events: none;
            z-index: 10;
        }

        .recap-poster:hover::after {
            left: 150%;
            transition: 0.7s ease-in-out;
        }

        @keyframes luxuryReveal {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .recap-poster:hover {
            transform: translateY(-6px);
            border-color: var(--neon-cyan);
            box-shadow: 0 12px 36px rgba(0, 243, 255, 0.15);
        }

        .poster-header h2 {
            font-family: var(--font-heading);
            font-size: 1.15rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            margin: 0;
        }

        .blended-graph {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: contrast(1.1) brightness(1.2) drop-shadow(0 0 5px var(--neon-cyan));
            animation: graphGrow 1.5s ease-out forwards;
            opacity: 0;
        }

        @keyframes graphGrow {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* SOCIAL SHARE SYSTEM */
        .share-menu-wrap {
            position: relative;
            width: 100%;
            margin-top: 0.5rem;
            flex-shrink: 0;
            z-index: 5;
        }

        .share-main-btn {
            width: 100%;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan));
            color: white;
            border: none;
            padding: 0.6rem;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(157, 0, 255, 0.25);
        }

        .share-main-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 18px rgba(0, 243, 255, 0.35);
            filter: brightness(1.1);
        }

        .share-dropdown {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(10, 5, 25, 0.98);
            border: 1px solid rgba(157, 0, 255, 0.35);
            border-radius: 14px;
            padding: 0.6rem;
            display: none;
            flex-direction: column;
            gap: 0.4rem;
            box-shadow: 0 -8px 30px rgba(157, 0, 255, 0.2);
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        .share-dropdown.open { display: flex; }

        .share-option {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0.8rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.78rem;
            font-family: var(--font-body);
            font-weight: 600;
            transition: all 0.2s;
            border: none;
            background: transparent;
            color: white;
            width: 100%;
            text-align: left;
        }

        .share-option:hover { background: rgba(255,255,255,0.07); transform: translateX(3px); }

        .share-option .opt-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .opt-wa   { background: #25D366; }
        .opt-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .opt-tw   { background: #1DA1F2; }
        .opt-copy { background: rgba(0,243,255,0.2); border: 1px solid rgba(0,243,255,0.3); color: var(--neon-cyan); }

        .vibrant-stat-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid rgba(0, 243, 255, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1), inset 0 0 15px rgba(0, 243, 255, 0.05);
            animation: circlePopIn 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            margin: 0.25rem auto;
        }

        @keyframes circlePopIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .growth-chart-box {
            height: 145px;
            margin: 0.25rem 0;
        }

        .neon-select {
            background: rgba(13, 4, 26, 0.9);
            border: 1px solid var(--neon-purple);
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-family: var(--font-body);
            font-weight: 600;
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(157, 0, 255, 0.1);
            transition: all 0.3s;
        }
        .neon-select:hover, .neon-select:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        @keyframes eq1 { 0% { height: 6px; } 100% { height: 20px; } }
        @keyframes eq2 { 0% { height: 18px; } 100% { height: 8px; } }
        @keyframes eq3 { 0% { height: 10px; } 100% { height: 24px; } }
        
        .eq-bar-1 { animation: eq1 0.8s ease-in-out infinite alternate; }
        .eq-bar-2 { animation: eq2 0.6s ease-in-out infinite alternate; }
        .eq-bar-3 { animation: eq3 0.7s ease-in-out infinite alternate 0.2s; }
        .eq-bar-4 { animation: eq1 0.5s ease-in-out infinite alternate 0.1s; }
        .eq-bar-5 { animation: eq2 0.9s ease-in-out infinite alternate 0.3s; }
        .eq-bar-6 { animation: eq3 0.6s ease-in-out infinite alternate 0.1s; }
        .eq-bar-7 { animation: eq1 0.7s ease-in-out infinite alternate 0.4s; }
    </style>

    <script>
        // AUTH INTERCEPTOR
        const originalFetch = window.fetch;
        window.fetch = async (...args) => {
            let [resource, config] = args;
            config = config || {};
            config.headers = config.headers || {};
            
            const token = localStorage.getItem('primeedu_token');
            if (token) {
                config.headers['Authorization'] = `Bearer ${token}`;
            }
            
            const response = await originalFetch(resource, config);
            if (response.status === 401 && !window.location.pathname.endsWith('index.html')) {
                window.location.href = 'index.html';
            }
            return response;
        };

        // Close all share dropdowns when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.share-menu-wrap')) {
                document.querySelectorAll('.share-dropdown').forEach(d => d.classList.remove('open'));
            }
        });

        // ═══ AVATAR SYNC ═══
        const CHARACTERS = [
            { id: 'itachi', name: 'Itachi', img: 'assets/avatars/itachi.webp', fallback: 'https://i.pinimg.com/736x/f5/0f/52/f50f52e51a8b1f6e24a07e30a8d08157.jpg' },
            { id: 'goku', name: 'Goku', img: 'assets/avatars/goku.webp', fallback: 'https://i.pinimg.com/736x/c4/11/c9/c411c9e40e6f4b3d6e2a1f0c5b8a7d2e.jpg' },
            { id: 'gojo', name: 'Gojo', img: 'assets/avatars/gojo.webp', fallback: 'https://i.pinimg.com/736x/97/4a/5b/974a5b6a4e8b3c2d1f0e9a8b7c6d5e4f.jpg' },
            { id: 'sasuke', name: 'Sasuke', img: 'assets/avatars/sasuke.webp', fallback: 'https://i.pinimg.com/736x/4e/40/87/4e4087e01177d1c3ea5e7143e7284f9e.jpg' },
            { id: 'naruto', name: 'Naruto', img: 'assets/avatars/naruto.webp', fallback: 'https://i.pinimg.com/736x/d0/b5/3b/d0b53bc5ddd3b25c55ea471fa30c64d0.jpg' },
            { id: 'kakashi', name: 'Kakashi', img: 'assets/avatars/kakashi.webp', fallback: 'https://i.pinimg.com/736x/2b/3c/4d/2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e.jpg' },
        ];

        function getSelectedChar() {
            const id = localStorage.getItem('primeedu_avatar') || 'itachi';
            return CHARACTERS.find(c => c.id === id) || CHARACTERS[0];
        }

        function syncAvatars() {
            const char = getSelectedChar();
            document.querySelectorAll('.avatar-circle, #header-avatar').forEach(img => {
                img.src = char.img;
                img.onerror = () => { img.src = char.fallback; };
            });
        }
        syncAvatars();

        // ═══ SHARE SYSTEM ═══
        const pageUrl = window.location.href;

        function toggleShareMenu(btn) {
            const dropdown = btn.nextElementSibling;
            const isOpen = dropdown.classList.contains('open');
            document.querySelectorAll('.share-dropdown').forEach(d => d.classList.remove('open'));
            if (!isOpen) dropdown.classList.add('open');
        }

        function shareViaWhatsApp(title, text) {
            const msg = encodeURIComponent(`🔥 ${title}\n${text}\n\n📚 MavX Mndset Warrior Journey\n${pageUrl}`);
            window.open(`https://api.whatsapp.com/send?text=${msg}`, '_blank');
        }

        function shareViaInsta(title) {
            navigator.clipboard.writeText(`🔥 ${title} | MavX Mndset Warrior Journey 📚\n${pageUrl}`).then(() => {
                showShareToast('Caption copied! Open Instagram and paste it ✓');
            });
        }

        function shareViaTwitter(title, text) {
            const tweet = encodeURIComponent(`🔥 ${title} — ${text}\n\n📚 MavX Mndset Warrior Journey\n${pageUrl}`);
            window.open(`https://twitter.com/intent/tweet?text=${tweet}`, '_blank');
        }

        function copyShareLink(title, text) {
            const content = `🔥 ${title}\n${text}\n\nMavX Mndset Warrior Journey: ${pageUrl}`;
            navigator.clipboard.writeText(content).then(() => {
                showShareToast('Link & recap copied to clipboard ✓');
            });
        }

        function showShareToast(msg) {
            const t = document.createElement('div');
            t.style.cssText = `position:fixed;bottom:2rem;right:2rem;background:rgba(10,5,25,0.95);border:1px solid var(--neon-cyan);color:white;padding:0.75rem 1.5rem;border-radius:12px;font-size:0.8rem;z-index:99999;box-shadow:0 0 20px rgba(0,243,255,0.3);font-family:var(--font-body);transition:opacity 0.4s;`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 3000);
        }

        let currentWeeklyOffset = 0;
        let currentMonthlyOffset = 0;
        let currentYearlyOffset = 0;

        function getWeekRangeStr(offset) {
            const now = new Date();
            const day = now.getDay();
            const diff = now.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(now.setDate(diff));
            monday.setHours(0,0,0,0);
            
            const start = new Date(monday.getTime() - offset * 7 * 24 * 60 * 60 * 1000);
            const end = new Date(start.getTime() + 6 * 24 * 60 * 60 * 1000);
            
            const startStr = start.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
            const endStr = end.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
            return `${startStr} - ${endStr}`;
        }

        function getMonthRangeStr(offset) {
            const now = new Date();
            let year = now.getFullYear();
            let month = now.getMonth() - offset;
            while (month < 0) {
                month += 12;
                year -= 1;
            }
            const date = new Date(year, month, 1);
            return date.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
        }

        function getYearRangeStr(offset) {
            const now = new Date();
            return String(now.getFullYear() - offset);
        }

        function populateSelects() {
            const wSelect = document.getElementById('weekly-period-select');
            if (wSelect) {
                wSelect.innerHTML = `
                    <option value="0">Current Week (${getWeekRangeStr(0)})</option>
                    <option value="1">Previous Week (${getWeekRangeStr(1)}) [LOCKED]</option>
                    <option value="2">2 Weeks Ago (${getWeekRangeStr(2)}) [LOCKED]</option>
                    <option value="3">3 Weeks Ago (${getWeekRangeStr(3)}) [LOCKED]</option>
                    <option value="4">4 Weeks Ago (${getWeekRangeStr(4)}) [LOCKED]</option>
                `;
            }
            const mSelect = document.getElementById('monthly-period-select');
            if (mSelect) {
                mSelect.innerHTML = `
                    <option value="0">Current Month (${getMonthRangeStr(0)})</option>
                    <option value="1">Previous Month (${getMonthRangeStr(1)}) [LOCKED]</option>
                    <option value="2">2 Months Ago (${getMonthRangeStr(2)}) [LOCKED]</option>
                    <option value="3">3 Months Ago (${getMonthRangeStr(3)}) [LOCKED]</option>
                `;
            }
            const ySelect = document.getElementById('yearly-period-select');
            if (ySelect) {
                ySelect.innerHTML = `
                    <option value="0">Current Year (${getYearRangeStr(0)})</option>
                    <option value="1">Previous Year (${getYearRangeStr(1)}) [LOCKED]</option>
                `;
            }
        }

        // ═══ POSTER BUILDER ═══
        function createPoster(data, index = 0) {
            const char = getSelectedChar();
            const poster = document.createElement('div');
            poster.className = 'recap-poster';
            poster.style.animationDelay = `${index * 0.12}s`;
            poster.style.cursor = 'zoom-in';
            
            const roleImage = data.roleImage || 'assets/recap_chilling.jpg';
            poster.style.backgroundImage = `linear-gradient(180deg, rgba(13, 4, 26, 0.88) 0%, rgba(26, 10, 46, 0.94) 100%), url('${roleImage}')`;
            poster.style.backgroundSize = 'cover';
            poster.style.backgroundPosition = 'center';
            
            poster.addEventListener('click', function(e) {
                if (e.target.closest('.share-menu-wrap')) return;
                openZoomCard(poster.outerHTML);
            });

            const escapedTitle = (data.title || '').replace(/'/g, "\\'");
            const escapedContent = (data.content || data.statLabel || '').replace(/'/g, "\\'");
            const dropdownId = `share-dd-${Date.now()}-${index}`;

            let lockBadgeHtml = '';
            if (data.locked) {
                lockBadgeHtml = `
                    <div style="position:absolute; top:12px; right:12px; background:rgba(255,0,85,0.18); border:1px solid #ff0055; color:#ff0055; padding:0.2rem 0.5rem; border-radius:6px; font-size:0.55rem; font-weight:bold; letter-spacing:1px; z-index:15; display:flex; align-items:center; gap:3px;">
                        <i class="fas fa-lock" style="font-size: 0.55rem;"></i> LOCKED
                    </div>
                `;
            }

            poster.innerHTML = `
                ${lockBadgeHtml}
                <div class="poster-header" style="display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;">
                    <h2 style="margin-bottom:0.4rem;">${data.title}</h2>

            const listEl = document.getElementById('period-leaderboard-list');

            try {
                const res = await fetch(`${window.API_BASE_URL}/api/leaderboard/period?period=${period}`, {
                    headers: { 'Authorization': 'Bearer ' + token }

                if (res.ok) {
                    const data = await res.json();
                    listEl.innerHTML = '';
                    if (data.length === 0) {
                        listEl.innerHTML = '<p class="text-secondary" style="text-align:center;">No activity logged in this period.</p>';

    <!-- Zoom Modal -->
    <div class="modal-overlay" id="zoom-modal" style="display: none; z-index: 20000; align-items: center; justify-content: center; background: rgba(5, 2, 10, 0.9); position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow-y: auto;" onclick="if(event.target === this) closeZoomModal()">
        <button class="neon-btn" style="position: fixed; top: 20px; right: 20px; width: 45px; height: 45px; padding: 0; border-color: var(--neon-pink); color: var(--neon-pink); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; background: rgba(13, 4, 26, 0.9); z-index: 20010; box-shadow: 0 0 15px var(--neon-pink);" onclick="closeZoomModal()"><i class="fas fa-times"></i></button>
        <button class="neon-btn" style="position: fixed; bottom: 20px; left: 20px; width: 45px; height: 45px; padding: 0; border-color: var(--neon-cyan); color: var(--neon-cyan); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; background: rgba(13, 4, 26, 0.9); z-index: 20010; box-shadow: 0 0 15px var(--neon-cyan);" onclick="closeZoomModal()"><i class="fas fa-arrow-left"></i></button>
        
        <div class="zoom-modal-container" style="position: relative; max-width: 320px; width: 90%; transform: scale(1.05); transition: transform 0.3s; z-index: 20001; margin: auto;">
            <div id="zoom-card-target"></div>
        </div>
    </div>

    <!-- Period Leaderboard Modal -->
    <div class="modal-overlay" id="period-leaderboard-modal" style="display: none; z-index: 21000; align-items: center; justify-content: center; background: rgba(5, 2, 10, 0.95); position: fixed; top: 0; left: 0; width: 100%; height: 100%;" onclick="if(event.target === this) closePeriodLeaderboard()">
        <div class="modal-content" style="max-width: 450px; width: 90%; background: linear-gradient(135deg, #0d041a 0%, #1a0a2e 100%); border: 2px solid var(--neon-cyan); border-radius: 20px; padding: 2rem; position: relative; box-shadow: 0 0 30px rgba(0, 243, 255, 0.25);">
            <button class="neon-btn" style="position: absolute; top: 15px; right: 15px; width: 35px; height: 35px; padding: 0; border-color: var(--neon-pink); color: var(--neon-pink); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; background: transparent;" onclick="closePeriodLeaderboard()"><i class="fas fa-times"></i></button>
            <h2 id="period-leaderboard-title" style="font-family: var(--font-heading); color: var(--neon-cyan); text-align: center; font-size: 1.25rem; margin-bottom: 1.5rem; text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);"></h2>
            
            <div id="period-leaderboard-list" style="max-height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; padding-right: 0.5rem;">
                <!-- Dynamically populated entries -->
            </div>
        </div>
    </div>
<script src="notifications.js"></script>
</body>
</html>
