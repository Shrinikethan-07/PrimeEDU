<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard | MavX Mndset</title>
    <meta name="description" content="MavX Mndset Royal Leaderboard — champions of consistency compete for glory.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ══ ELEGANT LEADERBOARD ══ */
        .lb-page-wrap {
            max-width: 860px;
            margin: 0 auto;
        }

        .lb-podium {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 3rem;
            align-items: end;
        }

        .podium-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 1.5rem 1rem;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .podium-card::before {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
        }

        .podium-card.rank-1 {
            padding-top: 2rem;
            border-color: rgba(255, 215, 0, 0.35);
            background: rgba(255, 215, 0, 0.05);
        }
        .podium-card.rank-1::before { background: linear-gradient(90deg, transparent, #ffd700, transparent); }

        .podium-card.rank-2 {
            border-color: rgba(192, 192, 192, 0.3);
            background: rgba(192, 192, 192, 0.04);
        }
        .podium-card.rank-2::before { background: linear-gradient(90deg, transparent, #c0c0c0, transparent); }

        .podium-card.rank-3 {
            border-color: rgba(205, 127, 50, 0.3);
            background: rgba(205, 127, 50, 0.04);
        }
        .podium-card.rank-3::before { background: linear-gradient(90deg, transparent, #cd7f32, transparent); }

        .podium-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.3);
        }

        .podium-rank-badge {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 1rem;
            margin: 0 auto 1rem;
        }

        .rank-1 .podium-rank-badge { background: rgba(255,215,0,0.2); color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.3); }
        .rank-2 .podium-rank-badge { background: rgba(192,192,192,0.2); color: #c0c0c0; }
        .rank-3 .podium-rank-badge { background: rgba(205,127,50,0.2); color: #cd7f32; }

        .podium-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 0.75rem;
            display: block;
        }

        .rank-1 .podium-avatar { border: 3px solid #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.35); width: 74px; height: 74px; }
        .rank-2 .podium-avatar { border: 2px solid #c0c0c0; box-shadow: 0 0 12px rgba(192,192,192,0.2); }
        .rank-3 .podium-avatar { border: 2px solid #cd7f32; box-shadow: 0 0 12px rgba(205,127,50,0.2); }

        .podium-name {
            font-weight: 700;
            font-size: 0.82rem;
            color: white;
            margin-bottom: 0.3rem;
        }

        .podium-score {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 800;
        }

        .rank-1 .podium-score { color: #ffd700; }
        .rank-2 .podium-score { color: #c0c0c0; }
        .rank-3 .podium-score { color: #cd7f32; }

        .podium-sub {
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-top: 0.15rem;
        }

        .crown-icon {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.4rem;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }

        /* WARRIOR LIST */
        .warrior-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .warrior-row {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .warrior-row:hover {
            background: rgba(255,255,255,0.045);
            transform: translateX(4px);
            border-color: rgba(0,243,255,0.15);
        }

        .warrior-row.is-user {
            background: rgba(0, 243, 255, 0.07);
            border: 1.5px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.07);
        }

        .warrior-row.is-user::after {
            content: 'YOU';
            position: absolute;
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.6rem;
            font-family: var(--font-heading);
            color: var(--neon-cyan);
            letter-spacing: 2px;
            border: 1px solid rgba(0,243,255,0.4);
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
        }

        .warrior-rank-num {
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--text-secondary);
            min-width: 32px;
            text-align: center;
        }

        .warrior-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.15);
            flex-shrink: 0;
        }

        .warrior-info {
            flex: 1;
        }

        .warrior-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            margin-bottom: 0.2rem;
        }

        .warrior-discipline {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .warrior-balls {
            font-family: var(--font-heading);
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--neon-cyan);
            text-align: right;
            min-width: 70px;
        }

        .warrior-balls small {
            display: block;
            font-size: 0.58rem;
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-weight: 400;
        }

        .lb-section-label {
            font-family: var(--font-heading);
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin: 2rem 0 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        /* INTRO ANIMATION */
        @keyframes swordLeft {
            0% { transform: translate(-100px, -100px) rotate(-45deg); opacity: 0; }
            100% { transform: translate(60px, 30px) rotate(-45deg); opacity: 1; }
        }
        @keyframes swordRight {
            0% { transform: translate(100px, -100px) rotate(45deg) scaleX(-1); opacity: 0; }
            100% { transform: translate(-60px, 30px) rotate(45deg) scaleX(-1); opacity: 1; }
        }
        @keyframes shieldPop {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 20px #3b82f6); }
        }
        
        /* Sort Pills Style */
        .sort-pill {
            font-size: 0.8rem !important;
            padding: 0.5rem 1rem !important;
            border-color: rgba(255,255,255,0.15) !important;
            color: var(--text-secondary) !important;
            background: rgba(255,255,255,0.02) !important;
            box-shadow: none !important;
            transform: none !important;
        }
        .sort-pill.active {
            border-color: var(--neon-cyan) !important;
            color: var(--neon-cyan) !important;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.25) !important;
            background: rgba(0, 243, 255, 0.05) !important;
        }
        .sort-pill:hover {
            border-color: var(--neon-cyan) !important;
            color: white !important;
        }
    </style>
<script>
    const isLocal = window.location.hostname === 'localhost' || 
                    window.location.hostname === '127.0.0.1' ||

                    window.location.hostname === '';
    window.API_BASE_URL = isLocal ? 'http://127.0.0.1:5000' : 'https://primeedu.onrender.com';
</script>

    <script>
        // AUTH INTERCEPTOR
        const originalFetch = window.fetch;
        window.fetch = async (...args) => {
            let [resource, config] = args;
            config = config || {};
            config.headers = config.headers || {};
            
            const token = localStorage.getItem('primeedu_token');
            if (token) {
                config.headers['Authorization'] = `Bearer ${token}`;
            }
            
            const response = await originalFetch(resource, config);
            if (response.status === 401 && !window.location.pathname.endsWith('index.html')) {
                window.location.href = 'index.html';
            }
            return response;
        };

        const CHARACTERS = [
            { id: 'itachi', img: 'assets/avatars/itachi.webp', fallback: 'https://i.pinimg.com/736x/f5/0f/52/f50f52e51a8b1f6e24a07e30a8d08157.jpg' },
            { id: 'goku', img: 'assets/avatars/goku.webp', fallback: 'https://i.pinimg.com/736x/c4/11/c9/c411c9e40e6f4b3d6e2a1f0c5b8a7d2e.jpg' },
            { id: 'gojo', img: 'assets/avatars/gojo.webp', fallback: 'https://i.pinimg.com/736x/97/4a/5b/974a5b6a4e8b3c2d1f0e9a8b7c6d5e4f.jpg' },
            { id: 'sasuke', name: 'Sasuke', img: 'assets/avatars/sasuke.webp', fallback: 'https://i.pinimg.com/736x/4e/40/87/4e4087e01177d1c3ea5e7143e7284f9e.jpg' },
            { id: 'naruto', name: 'Naruto', img: 'assets/avatars/naruto.webp', fallback: 'https://i.pinimg.com/736x/d0/b5/3b/d0b53bc5ddd3b25c55ea471fa30c64d0.jpg' },
            { id: 'kakashi', name: 'Kakashi', img: 'assets/avatars/kakashi.webp', fallback: 'https://i.pinimg.com/736x/2b/3c/4d/2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e.jpg' },
        ];

        function syncAvatars() {
            const id = localStorage.getItem('primeedu_avatar') || 'itachi';
            const char = CHARACTERS.find(c => c.id === id) || CHARACTERS[0];
            document.querySelectorAll('.avatar-circle').forEach(img => {
                img.src = char.img;
                img.onerror = () => { img.src = char.fallback; };
            });
            const userAvatar = document.getElementById('user-lb-avatar');
            if (userAvatar) {
                userAvatar.src = char.img;
                userAvatar.onerror = () => { userAvatar.src = char.fallback; };
            }
        }
        syncAvatars();

        async function loadProfile() {
            try {
                const res = await fetch(window.API_BASE_URL + '/api/user/profile');
                const data = await res.json();
                const nameEl = document.getElementById('user-lb-name');
                if (nameEl) {
                    nameEl.innerText = data.leaderboard_name || data.name || 'Warrior';
                }
                const beansEl = document.getElementById('user-lb-beans');
                if (beansEl) {
                    const balls = (data.balls || 0).toLocaleString();
                    beansEl.innerHTML = `${balls}<small>Dragon Balls</small>`;
                }
            } catch (e) {}
        }
        loadProfile();

        // Custom Alert modal helpers
        function customAlert(title, message) {
            return new Promise((resolve) => {
                const modal = document.getElementById('custom-alert-modal');
                document.getElementById('custom-alert-title').innerText = title;
                document.getElementById('custom-alert-msg').innerText = message;
                modal.classList.add('active');
                
                const closeBtn = document.getElementById('custom-alert-close');
                const handler = () => {
                    modal.classList.remove('active');
                    closeBtn.removeEventListener('click', handler);
                    resolve();
                };
                closeBtn.addEventListener('click', handler);
            });
        }

        function customPrompt(title, desc, placeholder = '') {
            return new Promise((resolve) => {
                const modal = document.getElementById('custom-input-modal');
                document.getElementById('custom-input-title').innerText = title;
                document.getElementById('custom-input-desc').innerText = desc;
                const inputField = document.getElementById('custom-input-field');
                inputField.placeholder = placeholder;
                inputField.value = placeholder;
                modal.classList.add('active');
                
                const submitBtn = document.getElementById('custom-input-submit');
                const cancelBtn = document.getElementById('custom-input-cancel');
                
                const cleanup = () => {
                    modal.classList.remove('active');
                    submitBtn.removeEventListener('click', submitHandler);
                    cancelBtn.removeEventListener('click', cancelHandler);
                };
                
                const submitHandler = () => {
                    const val = inputField.value;
                    cleanup();
                    resolve(val);
                };
                const cancelHandler = () => {
                    cleanup();
                    resolve(null);
                };
                
                submitBtn.addEventListener('click', submitHandler);
                cancelBtn.addEventListener('click', cancelHandler);
            });
        }

        window.alert = function(msg) {
            customAlert("System Alert", msg);
        };

        let currentSort = 'balls';

        function getMetricText(u) {
            if (currentSort === 'focus_duration') {
                return `${(u.focus_duration_minutes || 0).toLocaleString()} min`;
            } else if (currentSort === 'sessions') {
                return `${(u.sessions_count || 0)} sessions`;
            } else if (currentSort === 'streak') {
                return `${(u.streak || 0)} days`;
            } else {
                return `${(u.balls || 0).toLocaleString()} Balls`;
            }
        }

        function getMetricLabel() {
            if (currentSort === 'focus_duration') {
                return 'Focus Duration';
            } else if (currentSort === 'sessions') {
                return 'Completed Sessions';
            } else if (currentSort === 'streak') {
                return 'Day Streak';
            } else {
                return 'Dragon Balls';
            }
        }

        async function changeSort(sortBy) {
            currentSort = sortBy;
            document.querySelectorAll('.sort-pill').forEach(btn => {
                if (btn.getAttribute('data-sort') === sortBy) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            await loadLeaderboard();
        }

        async function loadLeaderboard() {
            try {
                const res = await fetch(window.API_BASE_URL + '/api/leaderboard?sort_by=' + currentSort);
                const users = await res.json();
                
                const podiumDiv = document.getElementById('dynamic-podium');
                const listDiv = document.getElementById('dynamic-list');
                
                const myName = localStorage.getItem('primeedu_leaderboard_name') || '';
                
                // Podium HTML Builder
                function getPodiumCard(u, rank) {
                    if (!u) return '';
                    let char = CHARACTERS.find(c => c.id === u.avatar) || CHARACTERS[0];
                    let crown = rank === 1 ? '<div class="crown-icon"><i class="fas fa-crown"></i></div>' : '';
                    return `
                    <div class="podium-card rank-${rank}">
                        ${crown}
                        <div class="podium-rank-badge">${rank}</div>
                        <img src="${char.img}" alt="${char.name}" class="podium-avatar" onerror="this.src='${char.fallback}'">
                        <div class="podium-name">${u.name}</div>
                        <div class="podium-score">${getMetricText(u)}</div>
                        <div class="podium-sub">${getMetricLabel()}</div>
                    </div>`;
                }

                // Render Podium (Order: 2, 1, 3)
                let podiumHtml = '';
                if (users[1]) podiumHtml += getPodiumCard(users[1], 2);
                if (users[0]) podiumHtml += getPodiumCard(users[0], 1);
                if (users[2]) podiumHtml += getPodiumCard(users[2], 3);
                podiumDiv.innerHTML = podiumHtml;

                // Render List
                let listHtml = '';
                for (let i = 3; i < users.length; i++) {
                    let u = users[i];
                    let char = CHARACTERS.find(c => c.id === u.avatar) || CHARACTERS[0];
                    let isMe = (u.name === myName) ? 'is-user' : '';
                    let nameDisplay = isMe ? `<span id="user-lb-name">${u.name}</span> <i class="fas fa-edit" style="cursor:pointer; font-size: 0.8rem; opacity:0.7;" onclick="editHandle()" title="Edit Handle"></i>` : u.name;
                    
                    listHtml += `
                    <div class="warrior-row ${isMe}">
                        <div class="warrior-rank-num" style="color:${isMe ? 'var(--neon-cyan)' : '#a090c0'};">${i + 1}</div>
                        <img src="${char.img}" alt="${char.name}" class="warrior-avatar" style="${isMe ? 'border-color:var(--neon-cyan);' : ''}" onerror="this.src='${char.fallback}'">
                        <div class="warrior-info">
                            <div class="warrior-name" style="${isMe ? 'color:var(--neon-cyan); display:flex; align-items:center; gap:0.5rem;' : ''}">
                                ${nameDisplay}
                            </div>
                            <div class="warrior-discipline">Streak: ${u.streak} Days</div>
                        </div>
                        <div class="warrior-balls" style="${isMe ? 'color:var(--neon-cyan);' : ''}">${getMetricText(u)}<small>${getMetricLabel()}</small></div>
                    </div>`;
                }
                listDiv.innerHTML = listHtml;
                
            } catch (e) {
                console.error("Leaderboard load failed", e);
            }
        }
        loadLeaderboard();
        window.addEventListener('storage', (e) => {
            if (e.key === 'primeedu_balls') {
                loadLeaderboard();
            }
        });

        function shareLeaderboard() {
            const text = "Check out my rank on the MavX Mndset Leaderboard! Only the most consistent warriors make it to the top. Can you beat me?";
            if (navigator.share) {
                navigator.share({
                    title: 'MavX Mndset Leaderboard',
                    text: text,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(`${text} \n${window.location.href}`);
                customAlert("Share Leaderboard", "Leaderboard link copied to clipboard! Share it with your friends.");
            }
        }

        window.editHandle = async () => {
            const current = document.getElementById('user-lb-name').innerText;
            const newHandle = await customPrompt("Edit Handle", "Enter your new warrior handle:", current);
            if (newHandle && newHandle.trim() !== "" && newHandle !== current) {
                try {
                    const res = await fetch(window.API_BASE_URL + '/api/user/profile', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ leaderboard_name: newHandle.trim() })
                    });
                    if(res.ok) {
                        document.getElementById('user-lb-name').innerText = newHandle.trim();
                        localStorage.setItem('primeedu_leaderboard_name', newHandle.trim());
                        loadLeaderboard();
                    }
                } catch(e) {
                    customAlert("Error", "Failed to update handle.");
                }
            }
        };

        // ═══ INTRO ANIMATION & SOUND ═══
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSwordSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            // Sharp squeaky slice sound
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sawtooth';
            // Sharp pitch drop
            osc.frequency.setValueAtTime(3500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.15);
            
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.6, audioCtx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.2);
        }

        setTimeout(() => {
            playSwordSound();
        }, 500);

        setTimeout(() => {
            const intro = document.getElementById('lb-intro');
            if (intro) {
                intro.style.opacity = '0';
                setTimeout(() => intro.style.display = 'none', 500);
            }
        }, 1800);
    
        function shareLeaderboardRank() {
            const userName = localStorage.getItem('primeedu_leaderboard_name') || 'Ascended Warrior';
            const balls = document.getElementById('ball-count') ? document.getElementById('ball-count').innerText : 'some';
            
            // Find user's rank
            let myRank = '?';
            const rows = document.querySelectorAll('.warrior-row');
            rows.forEach(row => {
                const nameEl = row.querySelector('div[style*="font-weight: 700"]');
                if (nameEl && nameEl.innerText === userName) {
                    const rankEl = row.querySelector('div[style*="font-family: var(--font-heading)"]');
                    if (rankEl) myRank = rankEl.innerText.replace('#','');
                }
            });
            
            const shareText = `🔥 I am currently Rank #${myRank} globally on MavX Mndset with ${balls} Dragon Balls!\n\nThe grind to mastery never stops. Join the arena.\n\n📚 MavX Mndset Warrior Journey: https://mavx-mndset.web.app`;
            
            if (navigator.share) {
                navigator.share({
                    title: 'My MavX Mndset Rank',
                    text: shareText
                }).catch(err => console.log('Error sharing', err));
            } else {
                navigator.clipboard.writeText(shareText).then(() => {
                    const btn = document.getElementById('share-rank-btn');
                    btn.innerHTML = '<i class="fas fa-check"></i> COPIED!';
                    setTimeout(() => {
                        btn.innerHTML = '<i class="fas fa-share-alt"></i> SHARE RANK';
                    }, 2000);
                });
            }
        }
    </script>
