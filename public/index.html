<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MavX Mndset | Authentication</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --synth-purple: #8b5cf6;
            --synth-pink: #ff2a85;
            --synth-blue: #0ea5e9;
            --glass-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('assets/login-bg.png') center/cover no-repeat;
            background-color: #0f172a;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(23,0,48,0.4) 0%, rgba(14,0,33,0.7) 100%);
            z-index: 1;
        }

        .login-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(139, 92, 246, 0.15);
            text-align: center;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .logo-wrap {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .logo-wrap i { font-size: 2.5rem; color: var(--synth-pink); filter: drop-shadow(0 0 10px var(--synth-pink)); }
        .logo-wrap h1 { font-family: 'Montserrat', sans-serif; font-size: 2rem; font-weight: 800; color: var(--text-main); letter-spacing: -1px; text-transform: uppercase; }
        .subtitle { color: #cbd5e1; font-size: 0.9rem; margin-bottom: 2rem; line-height: 1.5; }

        .input-group { margin-bottom: 1rem; text-align: left; position: relative; }
        .input-group label { display: block; color: var(--synth-pink); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
        .input-group input { width: 100%; padding: 0.8rem 1.25rem; padding-left: 2.5rem; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; font-family: 'Inter', sans-serif; font-size: 1rem; transition: all 0.3s ease; }
        .input-group input:focus { outline: none; border-color: var(--synth-purple); box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); background: rgba(0, 0, 0, 0.4); }
        .input-group input::placeholder { color: #64748b; }
        .input-icon { position: absolute; left: 1rem; top: 2.1rem; color: #94a3b8; font-size: 0.9rem; }

        .btn-enter { width: 100%; padding: 1rem; margin-top: 1rem; background: linear-gradient(135deg, var(--synth-purple) 0%, var(--synth-pink) 100%); border: none; border-radius: 12px; color: white; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 1rem; letter-spacing: 1px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(255, 42, 133, 0.4); position: relative; overflow: hidden; }
        .btn-enter:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 42, 133, 0.6); }

        .loader { display: none; position: absolute; inset: 0; background: var(--glass-bg); backdrop-filter: blur(10px); border-radius: 24px; z-index: 10; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--synth-pink); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .form-view { display: none; }
        .form-view.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .switch-link { color: #0ea5e9; font-size: 0.8rem; text-decoration: underline; cursor: pointer; margin-top: 1.5rem; display: inline-block; }
        .switch-link:hover { color: #fff; }
    </style>
<script>
  const isLocal = window.location.hostname === 'localhost' || 
                  window.location.hostname === '127.0.0.1' || 
                  window.location.protocol === 'file:' || 
                  window.location.hostname === '';
  window.API_BASE_URL = isLocal ? 'http://127.0.0.1:5000' : 'https://primeedu.onrender.com';
</script>
</head>
<body>

    <!-- Custom Alert Modal -->
    <div id="alert-modal" style="display: none; position: absolute; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); z-index: 9999; flex-direction: column; align-items: center; justify-content: center;">
        <div style="max-width: 400px; text-align: center; border: 1px solid var(--synth-blue); box-shadow: 0 0 30px rgba(14, 165, 233, 0.3); background: rgba(15, 23, 42, 0.9); padding: 2.5rem; border-radius: 24px;">
            <i class="fas fa-info-circle" style="font-size: 3rem; color: var(--synth-blue); margin-bottom: 1rem;"></i>
            <h3 style="color: white; margin-bottom: 0.5rem; font-family: 'Montserrat', sans-serif;">System Notification</h3>
            <p id="alert-msg" style="color: #cbd5e1; font-size: 0.9rem; margin-bottom: 1.5rem;"></p>
            <button class="btn-enter" style="background: linear-gradient(135deg, var(--synth-blue) 0%, #2563eb 100%); box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);" onclick="document.getElementById('alert-modal').style.display='none'">UNDERSTOOD</button>
        </div>
    </div>

    <div class="login-card">
        <div class="loader" id="loader" style="display: none; position: absolute; inset: 0; background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 100; flex-direction: column; align-items: center; justify-content: center; border-radius: 24px;">
            <div class="logo-wrap" style="animation: pulseSlow 2s ease-in-out infinite; margin-bottom: 1.5rem;">
                <i class="fas fa-bolt" style="font-size: 3rem; color: var(--synth-pink); filter: drop-shadow(0 0 15px var(--synth-pink));"></i>
                <h1 style="font-family: 'Montserrat', sans-serif; font-size: 2.2rem; font-weight: 800; color: white;">MavX Mndset</h1>
            </div>
            <div class="loading-bar-wrapper" style="width: 200px; height: 4px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-bottom: 1rem;">
                <div id="login-loader-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, var(--synth-purple), var(--synth-pink)); border-radius: 10px; box-shadow: 0 0 8px var(--synth-pink); transition: width 0.3s ease;"></div>
            </div>
            <p style="color: var(--text-main); font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.8;" id="loader-msg">Authenticating...</p>
        </div>

        <div class="logo-wrap">
            <i class="fas fa-bolt"></i>
            <h1>MavX Mndset</h1>
        </div>
        
        <p class="subtitle" id="subtitle-txt">Secure Access Gateway.</p>

        <!-- LOGIN FORM -->
        <div class="form-view active" id="view-login">
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Google Email ID</label>
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="login-email" placeholder="example@gmail.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="login-pass" placeholder="Enter password" required>
                </div>
                <div style="text-align: right; margin-top: -0.5rem;">
                    <span class="switch-link" style="font-size:0.7rem; margin-top:0;" onclick="switchView('view-otp-req')">Forgot Password?</span>
                </div>
                <button type="submit" class="btn-enter">AWAKEN <i class="fas fa-arrow-right" style="margin-left: 0.5rem;"></i></button>
            </form>
            <span class="switch-link" onclick="switchView('view-register')">New warrior? Forge your destiny here.</span>
        </div>

        <!-- REGISTER FORM -->
        <div class="form-view" id="view-register">
            <form onsubmit="handleRegisterSubmit(event)">
                <div class="input-group">
                    <label>Warrior Name</label>
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="reg-name" placeholder="Enter your display name" required>
                </div>
                <div class="input-group">
                    <label>Google Email ID</label>
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="reg-email" placeholder="example@gmail.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="reg-pass" placeholder="Create a password" required>
                </div>
                <button type="submit" id="reg-btn" class="btn-enter">SEND VERIFICATION OTP</button>
            </form>
            <span class="switch-link" onclick="switchView('view-login')">Already a warrior? Log in.</span>
        </div>

        <!-- REGISTER OTP FORM -->
        <div class="form-view" id="view-register-otp">
            <form onsubmit="handleRegisterOtpVerify(event)">
                <div class="input-group">
                    <label>Verification OTP</label>
                    <i class="fas fa-key input-icon"></i>
                    <input type="text" id="reg-verification-otp" placeholder="Enter 4-Digit OTP" required>
                </div>
                <button type="submit" class="btn-enter">VERIFY & REGISTER <i class="fas fa-user-plus" style="margin-left: 0.5rem;"></i></button>
            </form>
            <span class="switch-link" onclick="switchView('view-register')">Go Back / Change Details</span>
        </div>

        <!-- OTP REQUEST FORM -->
        <div class="form-view" id="view-otp-req">
            <form onsubmit="handleOtpReq(event)">
                <div class="input-group">
                    <label>Registered Google Email</label>
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="reset-email" placeholder="example@gmail.com" required>
                </div>
                <button type="submit" class="btn-enter">SEND OTP</button>
            </form>
            <span class="switch-link" onclick="switchView('view-login')">Back to Login</span>
        </div>

        <!-- OTP VERIFY FORM -->
        <div class="form-view" id="view-otp-verify">
            <form onsubmit="handleOtpVerify(event)">
                <div class="input-group">
                    <label>4-Digit OTP</label>
                    <i class="fas fa-key input-icon"></i>
                    <input type="text" id="reset-otp" placeholder="Enter 4-Digit OTP" required>
                </div>
                <div class="input-group">
                    <label>New Password</label>
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="reset-new-pass" placeholder="Create a new password" required>
                </div>
                <button type="submit" class="btn-enter">RESET PASSWORD</button>
            </form>
            <span class="switch-link" onclick="switchView('view-login')">Cancel</span>
        </div>
    </div>

    <script>
        let isOtpSent = false;
        function switchView(viewId) {
            document.querySelectorAll('.form-view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            const sub = document.getElementById('subtitle-txt');
            if(viewId === 'view-login') sub.innerText = "Log in to synchronize your progress and access the neural interface.";
            if(viewId === 'view-register') {
                sub.innerText = "Forge a new path. Your journey to mastery begins here.";
                isOtpSent = false;
                document.getElementById('reg-verification-otp').required = false;
                document.getElementById('reg-verification-otp').value = '';
            }
            if(viewId === 'view-register-otp') {
                const emailVal = document.getElementById('reg-email').value;
                sub.innerText = "Verify your email. A 4-digit OTP has been sent to " + emailVal + ".";
                document.getElementById('reg-verification-otp').required = true;
            }
            if(viewId === 'view-otp-req') sub.innerText = "Enter your email address to receive a recovery OTP.";
            if(viewId === 'view-otp-verify') sub.innerText = "Enter the OTP sent to your email to reset your password.";
        }
        
        // Initial setup
        switchView('view-login');

        function showLoad(msg) {
            document.getElementById('loader-msg').innerText = msg;
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';
            const bar = document.getElementById('login-loader-bar');
            bar.style.width = '0%';
            setTimeout(() => {
                bar.style.width = '40%';
            }, 50);
            setTimeout(() => {
                bar.style.width = '85%';
            }, 500);
        }
        function hideLoad() {
            const bar = document.getElementById('login-loader-bar');
            if (bar) bar.style.width = '100%';
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
            }, 200);
        }
        
        function showAlert(msg) {
            document.getElementById('alert-msg').innerText = msg;
            document.getElementById('alert-modal').style.display = 'flex';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            showLoad("AUTHENTICATING...");
            try {
                const res = await fetch(window.API_BASE_URL + '/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password: pass })
                });
                const data = await res.json();
                if(res.ok) {
                    localStorage.setItem('primeedu_token', data.token);
                    localStorage.setItem('primeedu_leaderboard_name', data.name);
                    localStorage.setItem('primeedu_email', email);
                    window.location.href = 'dashboard.html';
                } else {
                    showAlert(data.message || "Login failed");
                    hideLoad();
                }
            } catch(e) { showAlert("Error connecting to server."); hideLoad(); }
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            
            showLoad("DISPATCHING VERIFICATION OTP...");
            try {
                const res = await fetch(window.API_BASE_URL + '/api/auth/register/request_otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if(res.ok) {
                    isOtpSent = true;
                    switchView('view-register-otp');
                    showAlert(data.message || "Verification OTP sent! Please check your Google email inbox.");
                    hideLoad();
                } else {
                    showAlert(data.message || "Failed to send verification OTP");
                    hideLoad();
                }
            } catch(e) { showAlert("Error connecting to server."); hideLoad(); }
        }

        async function handleRegisterOtpVerify(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const otp = document.getElementById('reg-verification-otp').value;
            
            showLoad("VERIFYING & REGISTERING...");
            try {
                const res = await fetch(window.API_BASE_URL + '/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name, email, password: pass, otp })
                });
                const data = await res.json();
                if(res.ok) {
                    // Auto-login upon successful registration
                    try {
                        const loginRes = await fetch(window.API_BASE_URL + '/api/auth/login', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ email, password: pass })
                        });
                        const loginData = await loginRes.json();
                        if(loginRes.ok) {
                            localStorage.setItem('primeedu_token', loginData.token);
                            localStorage.setItem('primeedu_leaderboard_name', loginData.name);
                            localStorage.setItem('primeedu_email', email);
                            window.location.href = 'dashboard.html';
                        } else {
                            switchView('view-login');
                            document.getElementById('login-email').value = email;
                            hideLoad();
                        }
                    } catch(e) {
                        switchView('view-login');
                        document.getElementById('login-email').value = email;
                        hideLoad();
                    }
                } else {
                    showAlert(data.message || "Registration failed");
                    hideLoad();
                }
            } catch(e) { showAlert("Error connecting to server."); hideLoad(); }
        }

        async function handleOtpReq(e) {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            showLoad("DISPATCHING OTP...");
            try {
                const res = await fetch(window.API_BASE_URL + '/api/auth/otp/request', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if(res.ok) {
                    switchView('view-otp-verify');
                    hideLoad();
                } else {
                    showAlert(data.message || "Failed to request OTP");
                    hideLoad();
                }
            } catch(e) { showAlert("Error connecting to server."); hideLoad(); }
        }

        async function handleOtpVerify(e) {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            const otp = document.getElementById('reset-otp').value;
            const new_pass = document.getElementById('reset-new-pass').value;
            showLoad("VERIFYING IDENTITY...");
            try {
                const res = await fetch(window.API_BASE_URL + '/api/auth/otp/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, otp, new_password: new_pass })
                });
                const data = await res.json();
                if(res.ok) {
                    showAlert("Password reset successful. Please log in with your new password.");
                    switchView('view-login');
                    document.getElementById('login-email').value = email;
                    hideLoad();
                } else {
                    showAlert(data.message || "Failed to verify OTP");
                    hideLoad();
                }
            } catch(e) { showAlert("Error connecting to server."); hideLoad(); }
        }

        function resetRegOtpState() {
            if (!isOtpSent) return;
            isOtpSent = false;
        }

        document.getElementById('reg-name').addEventListener('input', resetRegOtpState);
        document.getElementById('reg-email').addEventListener('input', resetRegOtpState);
        document.getElementById('reg-pass').addEventListener('input', resetRegOtpState);
    </script>
    <script src="notifications.js"></script>
</body>
</html>
